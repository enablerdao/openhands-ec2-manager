name: Deploy OpenHands EC2 Manager

on:
  push:
    branches:
      - main
      - master
      - add-github-actions-integration
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          cd client && (npm ci || npm install)
          cd ../server && (npm ci || npm install)

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Build server
        run: |
          cd server
          npm run build

      - name: Deploy to manager server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MANAGER_HOST }}
          username: ${{ secrets.MANAGER_USERNAME }}
          key: ${{ secrets.MANAGER_SSH_KEY }}
          script: |
            cd /home/ubuntu/openhands-ec2-manager
            git pull
            cd client
            git pull
            npm ci || npm install
            npm run build
            cd ../server
            npm ci || npm install
            npm run build
            pm2 restart openhands-ec2-manager || pm2 start dist/index.js --name openhands-ec2-manager
