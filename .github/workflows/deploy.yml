name: Deploy OpenHands EC2 Manager

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
          
      - name: Install dependencies for client
        run: |
          cd client
          npm install
          
      - name: Build client
        run: |
          cd client
          npm run build
          
      - name: Install dependencies for server
        run: |
          cd server
          npm install
          
      - name: Build server
        run: |
          cd server
          npm run build || echo "Build failed but continuing..."
          
      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Update frontend
            rm -rf /var/www/manager/*
            mkdir -p /var/www/manager
            
            # Copy new build
            cp -r /home/ubuntu/deploy/client/build/* /var/www/manager/
            
            # Restart server
            cd /home/ubuntu/simple-server
            pm2 restart openhands-manager-api || node server.js > server.log 2>&1 &
            
      - name: Deploy to staging
        if: github.event_name == 'pull_request'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Update frontend
            rm -rf /var/www/manager/*
            mkdir -p /var/www/manager
            
            # Copy new build
            cp -r /home/ubuntu/deploy/client/build/* /var/www/manager/
            
            # Restart server
            cd /home/ubuntu/simple-server
            pm2 restart openhands-manager-api || node server.js > server.log 2>&1 &
